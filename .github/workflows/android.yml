name: android

# Every pull request and push to main: lint, unit tests, and a debug APK to download
# (design §16.3). The Rust job joins once crates/ts-mobile exists in the website repo
# (roadmap M0-6); until then the app has no native code.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test
      - name: Lint
        run: ./gradlew lintDebug
      - name: Debug APKs
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: '**/build/reports/**'
          retention-days: 7
