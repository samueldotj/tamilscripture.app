name: android

# Every pull request and push to main: native library from the website repo at the
# commit pinned in rust/website.ref, then lint, unit tests and a debug APK (design §16.3).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "ref=$(cat rust/website.ref)" >> "$GITHUB_OUTPUT"
      - name: Website crates at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: samueldotj/tamilscripture.com
          ref: ${{ steps.pin.outputs.ref }}
          path: website
          sparse-checkout: |
            Cargo.toml
            Cargo.lock
            crates
            data/books.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: website
      - run: cargo install cargo-ndk --locked
      - name: Native library and Kotlin bindings
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-rust.sh website
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test
      - name: Lint
        run: ./gradlew lintDebug
      - name: Debug APKs
        run: ./gradlew assembleDebug
      # Release-only problems (R8, dependencies that debug builds get for free) show up here.
      - name: Release build
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: '**/build/reports/**'
          retention-days: 7
