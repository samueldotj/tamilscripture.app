name: release

# A tag v1.2.3 builds signed APKs for a GitHub Release and the AAB for Play's internal
# track (design §16.4). Production promotion stays manual in the Play Console.

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches version.properties
        run: |
          want="v$(sed -n 's/^version=//p' version.properties)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME, but version.properties says $want"; exit 1; }
      - id: pin
        run: echo "ref=$(cat rust/website.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: samueldotj/tamilscripture.com
          ref: ${{ steps.pin.outputs.ref }}
          path: website
          sparse-checkout: |
            Cargo.toml
            Cargo.lock
            crates
            data/books.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-rust.sh website
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upload keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Signed APKs
        run: ./gradlew assembleRelease
        env:
          TS_KEYSTORE: ${{ runner.temp }}/upload.jks
          TS_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          TS_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          TS_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      - name: Signed bundle
        run: ./gradlew bundleRelease
        env:
          TS_KEYSTORE: ${{ runner.temp }}/upload.jks
          TS_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          TS_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          TS_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
      - name: Play internal track
        if: env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tamilscripture.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
      - if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
